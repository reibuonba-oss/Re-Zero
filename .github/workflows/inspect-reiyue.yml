name: Inspect Rei-Yue sample archive
on:
  push:
    branches:
      - inspect-reiyue-sample
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive without executing its contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p = pathlib.Path("Rei-Yue-Rev11-NoCrates-InjectorFix-Vietnamese.zip")
          with zipfile.ZipFile(p) as z:
              z.extractall("/tmp/rei-yue")
              print("ZIP_TEST:", z.testzip() or "OK")
              print("ENTRIES:")
              for i in z.infolist():
                  print(i.filename, i.file_size)
              for path in ("manifest.xml", "Localization/vi.csv"):
                  f = pathlib.Path("/tmp/rei-yue") / path
                  if f.exists():
                      print("\\n===== ", path, " =====")
                      print(f.read_text(encoding="utf-8-sig"))
          PY
      - name: Decompile sample NPC assembly
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path /tmp/ilspy
          /tmp/ilspy/ilspycmd -p -o /tmp/rei-decompiled /tmp/rei-yue/ReiNPC.dll
          python3 - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("/tmp/rei-decompiled").rglob("*.cs"))
          print("DECOMPILED_FILES:", len(files))
          total = 0
          for f in files:
              content = f.read_text(encoding="utf-8", errors="replace")
              remain = 45000 - total
              if remain <= 0:
                  print("DECOMPILE_OUTPUT_LIMIT_REACHED")
                  break
              print("\\n===== SOURCE:", f.relative_to("/tmp/rei-decompiled"), "=====")
              print(content[:remain])
              total += min(len(content), remain)
          PY

      - name: Inspect Manager archive
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p = pathlib.Path("Manager.zip")
          print("MANAGER_ARCHIVE_BYTES:", p.stat().st_size)
          with zipfile.ZipFile(p) as z:
              print("MANAGER_ZIP_TEST:", z.testzip() or "OK")
              print("MANAGER_ENTRY_COUNT:", len(z.infolist()))
              for i in z.infolist():
                  if i.is_dir():
                      continue
                  ext = pathlib.PurePosixPath(i.filename).suffix.lower()
                  if ext in {".dll",".exe",".csproj",".sln",".cs",".xml",".json",".md",".yml",".yaml",".txt"}:
                      print("MANAGER_ENTRY:", i.filename, i.file_size)
          PY

      - name: Inspect game API types for the Rem NPC
        shell: bash
        run: |
          mkdir -p /tmp/manager
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("Manager.zip") as z:
              z.extractall("/tmp/manager")
          PY
          echo "=== MATCHING GAME TYPES ==="
          /tmp/ilspy/ilspycmd -l c /tmp/manager/Manager/Assembly-CSharp.dll | grep -iE 'StoreStation|StoreClient|StoreClientManager|StoreClientListDict|PlayerStore|ModHook|SpriteDict|ModHelper|Phone|Holophone|ItemSpawner|ItemDirectory|CustomUI|Book|Paper' | head -120 || true
          for TYPE in StoreStation StoreClient StoreClientManager StoreClientListDict PhoneManager CustomUIManager ItemSpawner; do
            echo "===== TYPE: $TYPE ====="
            /tmp/ilspy/ilspycmd -t "$TYPE" /tmp/manager/Manager/Assembly-CSharp.dll 2>/dev/null | head -180 || true
          done

      - name: Inspect phone and paper APIs
        shell: bash
        run: |
          for TYPE in PhoneClientList PhoneDialogList StorePhoneClient PhoneUIManager PhoneBookUIManager StorePhoneObject CustomUIManager PaperBookRegistry PaperItemData GameItem GameItemFunc ModManifest; do
            echo "===== TYPE: $TYPE ====="
            /tmp/ilspy/ilspycmd -t "$TYPE" /tmp/manager/Manager/Assembly-CSharp.dll 2>/dev/null | head -240 || true
          done

      - name: Inspect inventory, future customer, food and drink APIs
        shell: bash
        run: |
          for TYPE in FoodItemDirectory MiscItemDirectory ItemDirectory ItemSpawner PlayerStore StoreClientManager StoreClientListDict; do
            echo "===== TYPE: $TYPE ====="
            /tmp/ilspy/ilspycmd -t "$TYPE" /tmp/manager/Manager/Assembly-CSharp.dll 2>/dev/null | head -260 || true
          done

      - name: Inspect mod loader API surface
        shell: bash
        run: |
          echo "=== MOD TYPES ==="
          /tmp/ilspy/ilspycmd -l c /tmp/manager/Manager/Assembly-CSharp.dll | grep -iE 'Mod|Phone|Inventory|Dialog' | head -160 || true
          for TYPE in ModHelper ModHook ModLog IMod ModManifest LoadedMod Directory GameItemElement Dialogue PlayerInventory GameInventory; do
            echo "===== TYPE: $TYPE ====="
            /tmp/ilspy/ilspycmd -t "$TYPE" /tmp/manager/Manager/Assembly-CSharp.dll 2>/dev/null | head -220 || true
          done
          echo "=== SAMPLE ASSEMBLY REFERENCES ==="
          /tmp/ilspy/ilspycmd -il /tmp/rei-yue/ReiNPC.dll | grep -E '^\.assembly extern|^\s+\.ver' | head -100 || true

      - name: Inspect Rem localization and scheduling APIs
        shell: bash
        run: |
          for TYPE in LocHelper ContactElement StorePhoneClient StoreClient StoreClientManager PlayerStore SpriteDict ModItemDirectory; do
            echo "===== TYPE: $TYPE ====="
            /tmp/ilspy/ilspycmd -t "$TYPE" /tmp/manager/Manager/Assembly-CSharp.dll 2>/dev/null | head -260 || true
          done

      - name: Inspect focused method bodies
        shell: bash
        run: |
          /tmp/ilspy/ilspycmd -p -o /tmp/game-src /tmp/manager/Manager/Assembly-CSharp.dll
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("/tmp/game-src")
          names = ["LocHelper.cs","ContactElement.cs","PlayerStore.cs","StoreClient.cs","StoreClientManager.cs","ModHelper.cs","SpriteDict.cs","ModItemDirectory.cs","GameItem.cs"]
          for name in names:
              matches = list(root.rglob(name))
              for f in matches[:1]:
                  text = f.read_text(encoding="utf-8", errors="replace")
                  print("\\n===== FOCUSED:", name, "=====")
                  terms = ["GetLocalizedClientName","OnInit(","QueueFuturClient","CompleteClientCreation","AddClient(","TryAddDirectSellingItemToTable","SetSpriteAndShapeFromMod","SetValue(","spriteDictionary","GameItem Add(","SetModData"]
                  for term in terms:
                      i = text.find(term)
                      if i >= 0:
                          print("--",term,"--")
                          print(text[max(0,i-600):min(len(text),i+1800)])
          PY

      - name: Inspect ClientIntent enum in supplied game assembly
        shell: bash
        run: |
          echo "=== TYPES CONTAINING INTENT ==="
          /tmp/ilspy/ilspycmd -l c /tmp/manager/Manager/Assembly-CSharp.dll | grep -i intent || true
          echo "=== StoreClient clientIntent declaration and enum ==="
          /tmp/ilspy/ilspycmd -t StoreClient /tmp/manager/Manager/Assembly-CSharp.dll | grep -n -C 8 -i 'clientIntent\|enum ' | head -180 || true
