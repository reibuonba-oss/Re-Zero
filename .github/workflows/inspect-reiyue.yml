name: Inspect Rei-Yue sample archive
on:
  push:
    branches:
      - inspect-reiyue-sample
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive without executing its contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p = pathlib.Path("Rei-Yue-Rev11-NoCrates-InjectorFix-Vietnamese.zip")
          with zipfile.ZipFile(p) as z:
              z.extractall("/tmp/rei-yue")
              print("ZIP_TEST:", z.testzip() or "OK")
              print("ENTRIES:")
              for i in z.infolist():
                  print(i.filename, i.file_size)
              for path in ("manifest.xml", "Localization/vi.csv"):
                  f = pathlib.Path("/tmp/rei-yue") / path
                  if f.exists():
                      print("\\n===== ", path, " =====")
                      print(f.read_text(encoding="utf-8-sig"))
          PY
      - name: Decompile sample NPC assembly
        shell: bash
        run: |
          dotnet tool install ilspycmd --tool-path /tmp/ilspy
          /tmp/ilspy/ilspycmd -p -o /tmp/rei-decompiled /tmp/rei-yue/ReiNPC.dll
          python3 - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("/tmp/rei-decompiled").rglob("*.cs"))
          print("DECOMPILED_FILES:", len(files))
          total = 0
          for f in files:
              content = f.read_text(encoding="utf-8", errors="replace")
              remain = 45000 - total
              if remain <= 0:
                  print("DECOMPILE_OUTPUT_LIMIT_REACHED")
                  break
              print("\\n===== SOURCE:", f.relative_to("/tmp/rei-decompiled"), "=====")
              print(content[:remain])
              total += min(len(content), remain)
          PY
